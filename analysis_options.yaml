# Legon Lift analyzer configuration (owned by WS1, see docs/SPEC.md 13).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # package:flutter/material.dart is deprecated in Flutter 3.50 (SPEC 0.2). Importing it reports
    # deprecated_member_use; we raise that to a warning so `flutter analyze` (zero warnings in the
    # Definition of Done) rejects it. Always import package:material_ui/material_ui.dart instead.
    deprecated_member_use: warning
    missing_return: error
    must_be_immutable: error

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    always_declare_return_types: true
    prefer_final_fields: true
    prefer_final_locals: true
    unawaited_futures: true
    avoid_relative_lib_imports: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_build_context_synchronously: true
